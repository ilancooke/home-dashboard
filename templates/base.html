<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Home Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style id="view-styles">{% block view_styles %}{% endblock %}</style>
</head>
<body>
    <header class="dashboard-header">
        <nav class="dashboard-nav" aria-label="Dashboard">
            <a href="/" data-view="weather"{% if request.path == '/' %} aria-current="page"{% endif %}>Weather</a>
            <a href="/audio" data-view="audio"{% if request.path == '/audio' %} aria-current="page"{% endif %}>Whole-Home Audio</a>
            <a href="/cameras" data-view="cameras"{% if request.path == '/cameras' %} aria-current="page"{% endif %}>Cameras</a>
        </nav>
        <button id="fullscreen-button" type="button" aria-pressed="false">Fullscreen</button>
    </header>
    <div id="navigation-message" role="status" hidden></div>
    <main id="dashboard-view" data-view="{% block view_name %}{% endblock %}" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='audio.js') }}"></script>
    <script src="{{ url_for('static', filename='cameras.js') }}"></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
