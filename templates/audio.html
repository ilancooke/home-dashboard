<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whole-Home Audio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .home-link,
        button,
        select {
            min-height: 44px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            padding: 0 16px;
            color: #fff;
            text-decoration: none;
        }

        #page-message {
            min-height: 22px;
            margin-bottom: 10px;
            color: #ffb4ab;
        }

        .zone-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .zone-card {
            padding: 12px;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            background: #202020;
        }

        .zone-card.updating {
            opacity: 0.65;
        }

        .zone-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .zone-heading h2 {
            margin: 0;
            font-size: 22px;
        }

        .state {
            padding: 4px 9px;
            border-radius: 999px;
            background: #555;
            font-size: 14px;
            font-weight: bold;
        }

        .state.on {
            background: #237a45;
        }

        .controls {
            display: grid;
            grid-template-columns: 112px minmax(120px, 1fr) 86px;
            gap: 8px;
            align-items: center;
        }

        button,
        select {
            width: 100%;
            padding: 7px 10px;
            cursor: pointer;
        }

        button.active {
            border-color: #d7a62b;
            background: #74570d;
        }

        button:disabled,
        select:disabled,
        input:disabled {
            cursor: wait;
        }

        .volume-control {
            display: grid;
            grid-column: 1 / -1;
            grid-template-columns: minmax(80px, 1fr) 30px;
            gap: 5px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            min-height: 44px;
            margin: 0;
        }

        .volume-value {
            text-align: right;
            font-size: 18px;
        }

        @media (max-width: 700px) {
            .zone-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

        }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>Whole-Home Audio</h1>
        <a class="home-link" href="/">Weather</a>
    </header>

    <div id="page-message" role="status">Loading amplifier status…</div>

    <main class="zone-grid">
        {% for zone, zone_name in zone_names.items() %}
            <section class="zone-card" id="zone-{{ zone }}" data-zone="{{ zone }}">
                <div class="zone-heading">
                    <h2>{{ zone_name }}</h2>
                    <span class="state">Unknown</span>
                </div>

                <div class="controls">
                    <button class="power-button" type="button" disabled>Power</button>

                    <select class="source-select" aria-label="Source for {{ zone_name }}" disabled>
                        <option value="0" disabled>No source</option>
                        {% for source, source_name in source_names.items() %}
                            <option value="{{ source }}">{{ source_name }}</option>
                        {% endfor %}
                    </select>

                    <button class="mute-button" type="button" disabled>Mute</button>

                    <div class="volume-control">
                        <input
                            class="volume-slider"
                            type="range"
                            min="0"
                            max="38"
                            value="0"
                            aria-label="Volume for {{ zone_name }}"
                            disabled
                        >
                        <span class="volume-value">0</span>
                    </div>
                </div>
            </section>
        {% endfor %}
    </main>

    <script>
        (function () {
            var zoneStates = {};
            var pageMessage = document.getElementById("page-message");

            function request(method, url, body, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open(method, url, true);
                xhr.setRequestHeader("Accept", "application/json");
                if (body !== null) {
                    xhr.setRequestHeader("Content-Type", "application/json");
                }
                xhr.onreadystatechange = function () {
                    var response;
                    if (xhr.readyState !== 4) {
                        return;
                    }
                    try {
                        response = JSON.parse(xhr.responseText);
                    } catch (error) {
                        response = {error: "Invalid response from dashboard"};
                    }
                    if (xhr.status >= 200 && xhr.status < 300) {
                        callback(null, response);
                    } else {
                        callback(response.error || "Audio request failed");
                    }
                };
                xhr.send(body === null ? null : JSON.stringify(body));
            }

            function setBusy(card, busy) {
                var controls = card.querySelectorAll("button, select, input");
                var index;
                card.className = busy ? "zone-card updating" : "zone-card";
                for (index = 0; index < controls.length; index += 1) {
                    controls[index].disabled = busy;
                }
            }

            function renderZone(status) {
                var card = document.getElementById("zone-" + status.zone);
                if (card === null) {
                    return;
                }
                var state = card.querySelector(".state");
                var power = card.querySelector(".power-button");
                var source = card.querySelector(".source-select");
                var mute = card.querySelector(".mute-button");
                var volume = card.querySelector(".volume-slider");

                zoneStates[status.zone] = status;
                state.textContent = status.power ? "On" : "Off";
                state.className = status.power ? "state on" : "state";
                power.textContent = status.power ? "Turn off" : "Turn on";
                power.className = status.power ? "power-button active" : "power-button";
                source.value = String(status.source);
                mute.textContent = status.mute ? "Unmute" : "Mute";
                mute.className = status.mute ? "mute-button active" : "mute-button";
                volume.value = status.volume;
                card.querySelector(".volume-value").textContent = status.volume;
                setBusy(card, false);
            }

            function showError(message) {
                pageMessage.textContent = message;
            }

            function loadZones() {
                request("GET", "/api/audio/zones", null, function (error, zones) {
                    var index;
                    if (error) {
                        showError(error);
                        return;
                    }
                    for (index = 0; index < zones.length; index += 1) {
                        renderZone(zones[index]);
                    }
                    pageMessage.textContent = "";
                });
            }

            function updateZone(zone, control, body) {
                var card = document.getElementById("zone-" + zone);
                setBusy(card, true);
                pageMessage.textContent = "";
                request(
                    "POST",
                    "/api/audio/zones/" + zone + "/" + control,
                    body,
                    function (error, status) {
                        if (error) {
                            setBusy(card, false);
                            showError(error);
                            return;
                        }
                        renderZone(status);
                    }
                );
            }

            function bindCard(card) {
                var zone = Number(card.getAttribute("data-zone"));
                var volume = card.querySelector(".volume-slider");

                card.querySelector(".power-button").onclick = function () {
                    updateZone(zone, "power", {on: !zoneStates[zone].power});
                };
                card.querySelector(".source-select").onchange = function () {
                    updateZone(zone, "source", {source: Number(this.value)});
                };
                card.querySelector(".mute-button").onclick = function () {
                    updateZone(zone, "mute", {muted: !zoneStates[zone].mute});
                };
                volume.oninput = function () {
                    card.querySelector(".volume-value").textContent = this.value;
                };
                volume.onchange = function () {
                    updateZone(zone, "volume", {volume: Number(this.value)});
                };
            }

            var cards = document.querySelectorAll(".zone-card");
            var index;
            for (index = 0; index < cards.length; index += 1) {
                bindCard(cards[index]);
            }

            loadZones();
            window.setInterval(loadZones, 30000);
        }());
    </script>
</body>
</html>
